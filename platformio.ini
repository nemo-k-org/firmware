; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
lib_ldf_mode = deep
upload_speed = 460800
monitor_speed = 115200
framework = arduino
lib_deps=
 ESP8266WiFi
 https://github.com/mplattu/EspSigK
 vshymanskyy/Preferences
 PaulStoffregen/OneWire
 https://github.com/milesburton/Arduino-Temperature-Control-Library
 https://github.com/adafruit/MAX6675-library
 https://github.com/mikalhart/TinyGPSPlus
 wollewald/ADS1115_WE

build_flags = 
    -DEspSigK_ESP8266
    -DNEMOK_SENSOR_TEST_HTTP=${sysenv.NEMOK_SENSOR_TEST_HTTP}
    -DNEMOK_SENSOR_TEMP_DS18B20=${sysenv.NEMOK_SENSOR_TEMP_DS18B20}
    -DNEMOK_SENSOR_TEMP_MAX6675=${sysenv.NEMOK_SENSOR_TEMP_MAX6675}
    -DNEMOK_SENSOR_GNSS_NEO6MV2=${sysenv.NEMOK_SENSOR_GNSS_NEO6MV2}
    -DNEMOK_SENSOR_GNSS_NEO6MV2_UDP=${sysenv.NEMOK_SENSOR_GNSS_NEO6MV2_UDP}
    -DNEMOK_SENSOR_ADC_TANKLEVEL=${sysenv.NEMOK_SENSOR_ADC_TANKLEVEL}

[env:esp01]
platform = espressif8266
board = esp01_1m
upload_resetmethod = nodemcu
board_build.filesystem = littlefs
