name: Build All Firmwares

on:
  workflow_dispatch:
  push:
    branches: [ github-actions ]

jobs:
  platformio-build:
    runs-on: ubuntu-latest
    container: infinitecoding/platformio-for-ci:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        run: docker run -v `pwd`:/opt/build --name pio-build infinitecoding/platformio-for-ci:latest /opt/build/ci-make-all.sh

      - name: Upload firware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error
